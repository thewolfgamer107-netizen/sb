<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#151424" />
  <title>Skyblock Daily Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">HYPIXEL SKYBLOCK</p><h1>Daily Tracker</h1></div>
    <div class="header-actions"><span id="todayLabel" class="date-chip"></span><button class="icon-button" id="settingsButton" title="Manage everything">⚙</button></div>
  </header>

  <main class="app-shell">
    <nav class="main-nav">
      <button class="nav-button active" data-view="today">Today</button>
      <button class="nav-button" data-view="history">History</button>
      <button class="nav-button" data-view="manage">Manage</button>
    </nav>

    <section id="todayView" class="view active">
      <div class="folder-frame">
        <div id="skillTabs" class="folder-tabs" aria-label="Skill folders"></div>
        <div class="folder-body">
          <div class="progress-panel">
            <div><span class="muted">Today's progress</span><strong id="progressText">0 / 0</strong></div>
            <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
          </div>
          <div id="skillContent" class="scroll-area"></div>
        </div>
      </div>
      <div class="bottom-actions"><button id="resetTodayButton" class="danger-secondary">Reset today's checkboxes</button></div>
    </section>

    <section id="historyView" class="view">
      <div class="section-heading"><div><p class="eyebrow">PAST DAYS</p><h2>History</h2></div><button id="exportButton" class="secondary-button">Export backup</button></div>
      <div class="history-controls"><label>Choose a date<input id="historyDate" type="date" /></label><button id="importButton" class="secondary-button">Import backup</button><input id="importFile" type="file" accept="application/json" hidden /></div>
      <div id="historySummary" class="summary-card"></div><div id="historyList" class="history-list"></div>
    </section>

    <section id="manageView" class="view">
      <div class="section-heading"><div><p class="eyebrow">CUSTOMIZE</p><h2>Manage Layout</h2></div><button id="addTaskButton" class="primary-button">+ Add task</button></div>
      <p class="muted manage-intro">Rename, move, edit, archive, or restore tasks. Old daily records stay attached to each task's permanent ID.</p>
      <div id="manageList" class="manage-list"></div>
    </section>
  </main>

  <dialog id="taskDialog"><form id="taskForm" method="dialog">
    <div class="dialog-heading"><h2 id="dialogTitle">Add task</h2><button type="button" data-close-dialog class="icon-button">✕</button></div>
    <input id="taskId" type="hidden" />
    <label>Task name<input id="taskName" required maxlength="60" placeholder="e.g. Visitors" /></label>
    <div class="form-grid"><label>Skill folder<select id="taskSkill"></select></label><label>Group box<select id="taskGroup"></select></label></div>
    <div class="form-grid"><label>Inner tab<select id="taskPanel"></select></label><label>Task type<select id="taskType"><option value="single">Single checkbox</option><option value="group">Multiple checkboxes</option></select></label></div>
    <div id="subtasksField" class="hidden"><label>Checklist items<textarea id="taskSubtasks" rows="6" placeholder="One item per line"></textarea></label></div>
    <div class="dialog-actions"><button type="button" data-close-dialog class="secondary-button">Cancel</button><button class="primary-button" value="default">Save task</button></div>
  </form></dialog>

  <dialog id="nameDialog"><form id="nameForm" method="dialog">
    <div class="dialog-heading"><h2 id="nameDialogTitle">Add</h2><button type="button" data-close-dialog class="icon-button">✕</button></div>
    <input id="nameMode" type="hidden" /><input id="nameContext" type="hidden" />
    <label id="nameLabel">Name<input id="newName" required maxlength="40" /></label>
    <div class="dialog-actions"><button type="button" data-close-dialog class="secondary-button">Cancel</button><button class="primary-button" value="default">Add</button></div>
  </form></dialog>

  <div id="toast" class="toast" role="status"></div><script src="app.js"></script>
</body>
</html>
