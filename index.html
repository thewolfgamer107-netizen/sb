<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#18152b" />
  <title>Skyblock Daily Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">HYPIXEL SKYBLOCK</p>
      <h1>Daily Tracker</h1>
    </div>
    <div class="header-actions">
      <span id="todayLabel" class="date-chip"></span>
      <button class="icon-button" id="settingsButton" aria-label="Manage tasks">⚙</button>
    </div>
  </header>

  <main class="app-shell">
    <nav class="main-nav" aria-label="Main navigation">
      <button class="nav-button active" data-view="today">Today</button>
      <button class="nav-button" data-view="history">History</button>
      <button class="nav-button" data-view="manage">Manage</button>
    </nav>

    <section id="todayView" class="view active">
      <div id="categoryTabs" class="tabs" aria-label="Task categories"></div>
      <div class="progress-panel">
        <div>
          <span class="muted">Today's progress</span>
          <strong id="progressText">0 / 0</strong>
        </div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </div>
      <div id="taskList" class="task-list"></div>
      <div class="bottom-actions">
        <button id="resetTodayButton" class="danger-secondary">Reset today's checkboxes</button>
      </div>
    </section>

    <section id="historyView" class="view">
      <div class="section-heading">
        <div><p class="eyebrow">PAST DAYS</p><h2>History</h2></div>
        <button id="exportButton" class="secondary-button">Export backup</button>
      </div>
      <div class="history-controls">
        <label>Choose a date <input id="historyDate" type="date" /></label>
        <button id="importButton" class="secondary-button">Import backup</button>
        <input id="importFile" type="file" accept="application/json" hidden />
      </div>
      <div id="historySummary" class="summary-card"></div>
      <div id="historyList" class="task-list"></div>
    </section>

    <section id="manageView" class="view">
      <div class="section-heading">
        <div><p class="eyebrow">CUSTOMIZE</p><h2>Manage Tasks</h2></div>
        <button id="addTaskButton" class="primary-button">+ Add task</button>
      </div>
      <p class="muted manage-intro">Tasks are archived instead of erased, so old history stays readable.</p>
      <div id="manageList" class="manage-list"></div>
    </section>
  </main>

  <dialog id="taskDialog">
    <form id="taskForm" method="dialog">
      <div class="dialog-heading"><h2 id="dialogTitle">Add task</h2><button type="button" id="closeDialog" class="icon-button">✕</button></div>
      <input id="taskId" type="hidden" />
      <label>Task name<input id="taskName" required maxlength="60" placeholder="e.g. Greenhouse" /></label>
      <label>Category<input id="taskCategory" required maxlength="30" placeholder="e.g. Farming" /></label>
      <label>Task type
        <select id="taskType">
          <option value="single">Single checkbox</option>
          <option value="group">Multiple checkboxes</option>
        </select>
      </label>
      <div id="subtasksField" class="hidden">
        <label>Checklist items<textarea id="taskSubtasks" rows="6" placeholder="One item per line"></textarea></label>
      </div>
      <div class="dialog-actions"><button type="button" id="cancelDialog" class="secondary-button">Cancel</button><button class="primary-button" value="default">Save task</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
